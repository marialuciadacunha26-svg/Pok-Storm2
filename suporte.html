<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PokéStorm Support</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#070312;
color:white;
padding:40px;
}

/* TOPO */

.top{
text-align:center;
margin-bottom:60px;
}

.top h1{
font-size:65px;
margin-bottom:20px;
}

.top span{
color:#b84dff;
}

.top p{
opacity:.7;
font-size:20px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:35px;
}

/* CARD */

.card{

background:rgba(255,255,255,.03);

border:1px solid rgba(255,255,255,.05);

padding:40px;

border-radius:30px;

transition:.3s;
}

.card:hover{

transform:translateY(-10px);

border:1px solid #b84dff;

box-shadow:0 0 35px rgba(184,77,255,.15);
}

.card h2{
font-size:35px;
margin-bottom:20px;
}

.card p{
opacity:.75;
line-height:1.8;
margin-bottom:30px;
}

.btn{

display:block;

text-align:center;

padding:18px;

border-radius:18px;

background:linear-gradient(45deg,#7b2dff,#c000ff);

color:white;

font-weight:700;

text-decoration:none;

transition:.3s;
}

.btn:hover{
transform:scale(1.03);
}

/* FORM */

.form{

margin-top:80px;

background:rgba(255,255,255,.03);

border:1px solid rgba(255,255,255,.05);

padding:40px;

border-radius:30px;
}

.form h2{
font-size:45px;
margin-bottom:30px;
}

input,textarea,select{

width:100%;

padding:18px;

margin-bottom:20px;

border:none;

outline:none;

border-radius:16px;

background:#12051f;

color:white;
}

textarea{
height:140px;
resize:none;
}

button{

width:100%;

padding:18px;

border:none;

border-radius:18px;

background:linear-gradient(45deg,#7b2dff,#c000ff);

color:white;

font-weight:700;

font-size:16px;

cursor:pointer;

transition:.3s;
}

button:hover{
transform:scale(1.02);
}

</style>
</head>

<body>

<div class="top">

<h1>
Central de <span>Suporte</span>
</h1>

<p>
Escolha uma opção abaixo para receber ajuda.
</p>

</div>

<div class="grid">

<!-- DISCORD -->

<div class="card">

<h2>
💬 Discord
</h2>

<p>
Abra tickets e converse diretamente
com nossa equipe de suporte.
</p>

<a 
href="https://discord.gg/q2jDmQxM3H"
target="_blank"
class="btn">

ABRIR DISCORD

</a>

</div>

<!-- WHATSAPP -->

<div class="card">

<h2>

</div>

<!-- STATUS -->

<div class="card">

<h2>
⚡ Status
</h2>

<p>
Todos os sistemas operando normalmente.
Nenhuma manutenção ativa.
</p>

<a href="#" class="btn">

SERVIDOR ONLINE

</a>

</div>

</div>

<!-- FORM -->

<div class="form">

<h2>
📩 Abrir Ticket
</h2>

<form>

<input type="text" placeholder="Seu nome">

<input type="email" placeholder="Seu email">

<select>

<option>
Escolha uma categoria
</option>

<option>
Compras
</option>

<option>
Bug
</option>

<option>
Denúncia
</option>

<option>
Suporte Geral
</option>

</select>

<textarea placeholder="Descreva seu problema"></textarea>

<button type="submit">

ENVIAR TICKET

</button>

</form>

</div>

</body>
</html>
